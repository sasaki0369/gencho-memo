<style>
:root{
  --bg:#f6f1e7;
  --card:#fffdf8;
  --accent:#b5764a;
  --accent-dark:#8f5a35;
  --accent-light:#e8cdb2;
  --text:#4a3b2c;
  --text-sub:#8a7a68;
  --border:#e6dcc9;
  --danger:#c0605a;
  --shadow:0 2px 8px rgba(90,60,30,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg); color:var(--text); padding-bottom:90px;
}
header{
  background:var(--accent); color:#fff; padding:16px 20px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50; box-shadow:var(--shadow);
}
header h1{font-size:19px; margin:0; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
header .sync-status{font-size:11px; opacity:.85;}
.tabs{
  display:flex; background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:56px; z-index:40;
}
.tab{
  flex:1; text-align:center; padding:12px 0; font-size:14px; color:var(--text-sub);
  border-bottom:3px solid transparent; cursor:pointer; font-weight:600;
}
.tab.active{color:var(--accent-dark); border-bottom-color:var(--accent);}
main{padding:14px; max-width:640px; margin:0 auto;}
.view{display:none;}
.view.active{display:block;}

/* --- カード --- */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
}
.entry-card{display:flex; gap:12px; cursor:pointer;}
.entry-thumb{
  width:78px; height:78px; border-radius:10px; object-fit:cover; flex-shrink:0;
  background:var(--accent-light); cursor:zoom-in;
}
.entry-thumb.noimg{display:flex; align-items:center; justify-content:center; font-size:26px;}
.entry-thumb-wrap{position:relative; flex-shrink:0;}
.entry-thumb-badge{
  position:absolute; bottom:3px; right:3px; background:rgba(0,0,0,.6); color:#fff;
  font-size:10px; padding:1px 6px; border-radius:10px; font-weight:700; pointer-events:none;
}
.entry-body{flex:1; min-width:0;}
.entry-date{font-size:12px; color:var(--text-sub);}
.entry-tags{display:flex; flex-wrap:wrap; gap:5px; margin:5px 0;}
.tag-chip{
  background:var(--accent-light); color:var(--accent-dark); font-size:11.5px;
  padding:2px 9px; border-radius:20px; font-weight:600; white-space:nowrap;
}
.entry-memo{font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.entry-target{font-size:12px; color:var(--text-sub); margin-top:2px;}

/* --- フォーム --- */
label{display:block; font-size:13px; font-weight:700; color:var(--accent-dark); margin:16px 0 6px;}
label:first-child{margin-top:0;}
input[type=text], input[type=datetime-local], textarea{
  width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
  font-size:15px; background:#fff; color:var(--text); font-family:inherit;
}
textarea{resize:vertical; min-height:80px;}
.photo-buttons{display:flex; gap:10px;}
.photo-btn{
  flex:1 1 0; min-width:0; box-sizing:border-box; margin:0;
  padding:14px 6px; border:2px dashed var(--accent-light); border-radius:12px;
  background:#fdf9f2; display:flex; align-items:center; justify-content:center;
  min-height:52px; text-align:center; font-size:13px; color:var(--accent-dark); font-weight:600;
}
.photo-preview-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.photo-preview-item{position:relative; width:88px; height:88px;}
.photo-preview-item img{
  width:100%; height:100%; object-fit:cover; border-radius:10px; cursor:zoom-in;
  background:var(--accent-light);
}
.photo-item-remove{
  position:absolute; top:-6px; right:-6px; background:rgba(0,0,0,.6); color:#fff;
  border:none; border-radius:50%; width:24px; height:24px; font-size:13px; line-height:1;
}
.photo-count-badge{
  position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,.6); color:#fff;
  font-size:10px; padding:1px 6px; border-radius:10px; font-weight:700;
}
.gps-info{font-size:12px; color:var(--text-sub); margin-top:6px;}
.gps-info.ok{color:#4a7a4a;}
.gps-info.ng{color:var(--danger);}

.tag-input-row{display:flex; gap:8px;}
.tag-input-row input{flex:1;}
.btn-small{
  background:var(--accent); color:#fff; border:none; border-radius:10px;
  padding:0 16px; font-size:14px; font-weight:700;
}
.tag-pool{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.tag-pool .tag-chip{
  cursor:pointer; border:1px solid transparent; padding:4px 12px;
}
.tag-pool .tag-chip.selected{background:var(--accent); color:#fff;}

.save-bar{
  position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:1px solid var(--border); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex; gap:10px; z-index:60;
}
.btn-main{
  flex:1; background:var(--accent); color:#fff; border:none; border-radius:12px;
  padding:14px; font-size:15px; font-weight:700;
}
.btn-cancel{
  background:#fff; color:var(--text-sub); border:1px solid var(--border); border-radius:12px;
  padding:14px 18px; font-size:14px;
}

#map{height:calc(100vh - 130px); min-height:400px; border-radius:0;}
.empty-msg{text-align:center; color:var(--text-sub); font-size:13px; padding:40px 0;}

.fab{
  position:fixed; right:18px; bottom:24px; width:58px; height:58px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:28px; border:none; box-shadow:0 4px 12px rgba(90,60,30,0.3);
  z-index:55; display:flex; align-items:center; justify-content:center;
}
.search-box{margin-bottom:12px;}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.filter-row .tag-chip{cursor:pointer; flex-shrink:0;}
.filter-row .tag-chip.selected{background:var(--accent); color:#fff;}

.leaflet-popup-content{font-size:13px; line-height:1.5;}
.leaflet-popup-content img{width:100%; border-radius:8px; margin-bottom:4px;}

/* --- 写真フルスクリーンビューア --- */
.photo-viewer{
  position:fixed; inset:0; background:rgba(10,8,5,0.95); z-index:300;
  display:none; align-items:center; justify-content:center;
}
.photo-viewer.active{display:flex;}
.photo-viewer-stage{
  width:100%; height:100%; overflow:hidden; display:flex;
  align-items:center; justify-content:center; touch-action:none;
}
.photo-viewer-img{
  max-width:100%; max-height:100%; touch-action:none; user-select:none;
  -webkit-user-drag:none; transform-origin:center center; will-change:transform;
}
.photo-viewer-close{
  position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px;
  background:rgba(255,255,255,.15); color:#fff; border:none; width:38px; height:38px;
  border-radius:50%; font-size:18px; z-index:310;
}
.photo-viewer-nav{
  position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15);
  color:#fff; border:none; width:44px; height:44px; border-radius:50%; font-size:26px;
  line-height:1; z-index:310;
}
.photo-viewer-prev{left:10px;}
.photo-viewer-next{right:10px;}
.photo-viewer-counter{
  position:absolute; top:calc(14px + env(safe-area-inset-top)); left:0; right:0;
  text-align:center; color:rgba(255,255,255,.85); font-size:13px; font-weight:600; z-index:305;
}
.photo-viewer-hint{
  position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); left:0; right:0;
  text-align:center; color:rgba(255,255,255,.6); font-size:12px; z-index:310; pointer-events:none;
}
</style>
</head>
<body>

<header>
  <h1>👷 現場メモ</h1>
  <span class="sync-status" id="syncStatus">同期中…</span>
</header>

<div class="tabs">
  <div class="tab active" data-view="listView">一覧</div>
  <div class="tab" data-view="mapView">地図</div>
</div>

<main>
  <!-- 一覧ビュー -->
  <div class="view active" id="listView">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="メモ・相手・タグで検索">
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div id="entryList"></div>
  </div>

  <!-- 地図ビュー -->
  <div class="view" id="mapView">
    <div id="map"></div>
  </div>

  <!-- 入力ビュー -->
  <div class="view" id="formView">
    <div class="card">
      <label>写真（複数登録できます）</label>
      <div class="photo-buttons">
        <label class="photo-btn">📷 撮影する
          <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none">
        </label>
        <label class="photo-btn">🖼 既存の写真
          <input type="file" accept="image/*" id="galleryInput" style="display:none" multiple>
        </label>
      </div>
      <div id="photoPreviewList" class="photo-preview-list"></div>
      <div class="gps-info" id="gpsInfo"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
        <button type="button" id="useCurrentLocationBtn" class="btn-small" style="display:none;">📍 現在地を使う</button>
        <button type="button" id="toggleMapPickerBtn" class="btn-small" style="background:#fff; color:var(--accent-dark); border:1px solid var(--accent-light);">🗺️ 地図で位置を選ぶ</button>
      </div>
      <div id="locationPickerMapWrap" style="display:none; margin-top:10px;">
        <div id="locationPickerMap" style="height:220px; border-radius:12px; overflow:hidden;"></div>
        <div style="font-size:12px; color:var(--text-sub); margin-top:6px;">地図をタップ、またはピンをドラッグして位置を調整できます</div>
      </div>

      <label>登録日時</label>
      <input type="datetime-local" id="dateInput">

      <label>現調種別タグ（複数選択可・新規入力もOK）</label>
      <div class="tag-input-row">
        <input type="text" id="newTagInput" placeholder="新しいタグを入力してEnter">
        <button class="btn-small" id="addTagBtn">追加</button>
      </div>
      <div class="tag-pool" id="tagPool"></div>

      <label>伝えたい相手</label>
      <input type="text" id="targetInput" placeholder="例：〇〇市 道路管理課 〇〇様">

      <label>メモ</label>
      <textarea id="memoInput" placeholder="現場の状況、気づいた点など"></textarea>
    </div>
  </div>
</main>

<button class="fab" id="fabAdd">＋</button>

<div class="save-bar" id="saveBar" style="display:none;">
  <button class="btn-cancel" id="cancelBtn">キャンセル</button>
  <button class="btn-main" id="saveBtn">保存する</button>
</div>

<!-- 写真フルスクリーンビューア -->
<div class="photo-viewer" id="photoViewer">
  <button class="photo-viewer-close" id="photoViewerClose">✕</button>
  <button class="photo-viewer-nav photo-viewer-prev" id="photoViewerPrev">‹</button>
  <button class="photo-viewer-nav photo-viewer-next" id="photoViewerNext">›</button>
  <div class="photo-viewer-stage" id="photoViewerStage">
    <img class="photo-viewer-img" id="photoViewerImg">
  </div>
  <div class="photo-viewer-counter" id="photoViewerCounter"></div>
  <div class="photo-viewer-hint">ピンチ／ダブルタップで拡大・縮小</div>
</div>

<script>
/* ==================== Firebase設定 ====================
  ここに自分のFirebaseプロジェクトの設定を入れてください。
  Firebaseコンソール → プロジェクトの設定 → 全般 → マイアプリ で取得できます。
  Realtime Database と Storage を有効化しておいてください。
======================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCzw3RUr0ewF_3u_TTxHLS-6hkig1EXs6U",
  authDomain: "gencho-memo.firebaseapp.com",
  databaseURL: "https://gencho-memo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gencho-memo",
  storageBucket: "gencho-memo.firebasestorage.app",
  messagingSenderId: "367700011953",
  appId: "1:367700011953:web:916413aa765a230078ab90"
};

let db, storage, useFirebase = true;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  storage = firebase.storage();
} catch(e){
  useFirebase = false;
  console.warn("Firebase未設定のためローカル保存モードで動作します", e);
}

const LOCAL_KEY = "genchoumemo_entries_v1";
const LOCAL_TAG_KEY = "genchoumemo_tags_v1";

let entries = {};   // id -> entry
let tagPoolList = []; // 蓄積タグ一覧
let selectedTags = [];
let currentPhotos = []; // 圧縮済みdataURLの配列
let currentPhotoGPS = null; // {lat, lng} (レコード全体で1つの位置)
let photoChosen = false;
let editingId = null;
let mapInstance = null;
let mapMarkers = [];
let activeFilterTags = [];

/* ---------- ユーティリティ ---------- */
function uid(){ return 'e' + Date.now() + Math.random().toString(36).slice(2,8); }
function formatDT(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,'0')+"/"+String(d.getDate()).padStart(2,'0')+
    " "+String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
}
function nowLocalInputValue(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

/* ---------- データ読み書き ---------- */
function saveEntriesLocal(){
  localStorage.setItem(LOCAL_KEY, JSON.stringify(entries));
}
function saveTagsLocal(){
  localStorage.setItem(LOCAL_TAG_KEY, JSON.stringify(tagPoolList));
}

function initData(){
  if (useFirebase){
    db.ref('entries').on('value', snap => {
      entries = snap.val() || {};
      document.getElementById('syncStatus').textContent = '同期済み';
      renderList();
      renderMap();
    }, err => {
      document.getElementById('syncStatus').textContent = '同期エラー';
      console.error(err);
      alert('データの読み込みに失敗しました：' + err.message + '\n\nFirebase Realtime Databaseの「ルール」タブで読み書きが許可されているか確認してください（テストモードなら通常は自動許可されています）。');
    });
    db.ref('tags').on('value', snap => {
      tagPoolList = snap.val() || [];
      renderTagPool();
      renderFilterRow();
    }, err => console.error('タグ読み込みエラー', err));
  } else {
    entries = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");
    tagPoolList = JSON.parse(localStorage.getItem(LOCAL_TAG_KEY) || "[]");
    document.getElementById('syncStatus').textContent = 'ローカル保存';
    renderList();
    renderMap();
    renderTagPool();
    renderFilterRow();
  }
}

function addTagToPool(tag){
  tag = tag.trim();
  if (!tag) return;
  if (tagPoolList.includes(tag)) return;
  tagPoolList.push(tag);
  if (useFirebase){
    db.ref('tags').set(tagPoolList).catch(err=>{
      console.error('タグ保存エラー', err);
      alert('タグの保存に失敗しました：' + err.message + '\n\nFirebase Realtime Databaseの「ルール」で読み書きが許可されているか確認してください。');
    });
  } else {
    saveTagsLocal();
    renderTagPool();
    renderFilterRow();
  }
}

function persistEntry(entry){
  entries[entry.id] = entry;
  if (useFirebase){
    document.getElementById('syncStatus').textContent = '保存中…';
    db.ref('entries/'+entry.id).set(entry)
      .then(()=>{
        document.getElementById('syncStatus').textContent = '同期済み';
      })
      .catch(err=>{
        console.error('登録の保存に失敗', err);
        document.getElementById('syncStatus').textContent = '保存エラー';
        alert('登録の保存に失敗しました：' + err.message + '\n\nFirebase Realtime Databaseの「ルール」で読み書きが許可されているか、写真サイズが大きすぎないか確認してください。');
      });
  } else {
    saveEntriesLocal();
    renderList();
    renderMap();
  }
}
function deleteEntry(id){
  delete entries[id];
  if (useFirebase){
    db.ref('entries/'+id).remove().catch(err=>{
      console.error('削除に失敗', err);
      alert('削除に失敗しました：' + err.message);
    });
  } else {
    saveEntriesLocal();
    renderList();
    renderMap();
  }
}

/* ---------- タブ切り替え ---------- */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(tab.dataset.view).classList.add('active');
    document.getElementById('fabAdd').style.display = 'flex';
    document.getElementById('saveBar').style.display = 'none';
    if (tab.dataset.view === 'mapView'){
      setTimeout(()=>{ if(mapInstance) mapInstance.invalidateSize(); }, 100);
    }
  });
});

/* ---------- 一覧描画 ---------- */
function renderTagPool(){
  const pool = document.getElementById('tagPool');
  pool.innerHTML = '';
  tagPoolList.forEach(tag=>{
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (selectedTags.includes(tag) ? ' selected' : '');
    chip.textContent = tag;
    chip.addEventListener('click', ()=>{
      if (selectedTags.includes(tag)){
        selectedTags = selectedTags.filter(t=>t!==tag);
      } else {
        selectedTags.push(tag);
      }
      renderTagPool();
    });
    pool.appendChild(chip);
  });
}

function renderFilterRow(){
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  tagPoolList.forEach(tag=>{
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (activeFilterTags.includes(tag) ? ' selected' : '');
    chip.textContent = tag;
    chip.addEventListener('click', ()=>{
      if (activeFilterTags.includes(tag)){
        activeFilterTags = activeFilterTags.filter(t=>t!==tag);
      } else {
        activeFilterTags.push(tag);
      }
      renderFilterRow();
      renderList();
    });
    row.appendChild(chip);
  });
}

function getFilteredSortedEntries(){
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  let list = Object.values(entries);
  if (q){
    list = list.filter(e =>
      (e.memo||'').toLowerCase().includes(q) ||
      (e.target||'').toLowerCase().includes(q) ||
      (e.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }
  if (activeFilterTags.length){
    list = list.filter(e => activeFilterTags.every(t => (e.tags||[]).includes(t)));
  }
  list.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return list;
}

function renderList(){
  const listEl = document.getElementById('entryList');
  const list = getFilteredSortedEntries();
  if (!list.length){
    listEl.innerHTML = '<div class="empty-msg">まだ記録がありません。右下の＋から追加できます。</div>';
    return;
  }
  listEl.innerHTML = '';
  list.forEach(e=>{
    const photos = e.photos || (e.photo ? [e.photo] : []);
    const card = document.createElement('div');
    card.className = 'card entry-card';
    card.innerHTML = `
      ${photos.length ? `
        <div class="entry-thumb-wrap">
          <img class="entry-thumb" src="${photos[0]}">
          ${photos.length > 1 ? `<span class="entry-thumb-badge">+${photos.length - 1}</span>` : ''}
        </div>
      ` : `<div class="entry-thumb noimg">📍</div>`}
      <div class="entry-body">
        <div class="entry-date">${formatDT(e.date)}</div>
        <div class="entry-tags">${(e.tags||[]).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>
        <div class="entry-target">${e.target ? '👤 '+escapeHtml(e.target) : ''}</div>
        <div class="entry-memo">${escapeHtml(e.memo||'')}</div>
      </div>
    `;
    card.addEventListener('click', ()=> openEditForm(e.id));
    if (photos.length){
      const thumbImg = card.querySelector('.entry-thumb');
      thumbImg.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        openPhotoViewer(photos, 0);
      });
    }
    listEl.appendChild(card);
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('searchInput').addEventListener('input', renderList);

/* ---------- 地図描画 ---------- */
function renderMap(){
  if (!mapInstance){
    mapInstance = L.map('map').setView([35.5, 139.4], 11); // 町田市周辺デフォルト
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(mapInstance);
  }
  mapMarkers.forEach(m=>mapInstance.removeLayer(m));
  mapMarkers = [];
  const withGps = Object.values(entries).filter(e=>e.lat && e.lng);
  withGps.forEach(e=>{
    const photos = e.photos || (e.photo ? [e.photo] : []);
    const marker = L.marker([e.lat, e.lng]).addTo(mapInstance);
    marker.bindPopup(`
      ${photos.length ? `<img src="${photos[0]}">` : ''}
      ${photos.length > 1 ? `<div style="font-size:11px; color:#8a7a68; margin:-2px 0 4px;">ほか${photos.length-1}枚</div>` : ''}
      <b>${formatDT(e.date)}</b><br>
      ${(e.tags||[]).map(t=>escapeHtml(t)).join('・')}<br>
      ${e.target ? '👤 '+escapeHtml(e.target)+'<br>' : ''}
      ${escapeHtml(e.memo||'')}
    `);
    mapMarkers.push(marker);
  });
  if (withGps.length){
    const group = L.featureGroup(mapMarkers);
    mapInstance.fitBounds(group.getBounds().pad(0.2));
  }
}

/* ---------- フォーム操作 ---------- */
function resetForm(){
  editingId = null;
  currentPhotos = [];
  currentPhotoGPS = null;
  photoChosen = false;
  selectedTags = [];
  renderPhotoPreviewList();
  document.getElementById('locationPickerMapWrap').style.display = 'none';
  updateGpsInfo();
  document.getElementById('dateInput').value = nowLocalInputValue();
  document.getElementById('targetInput').value = '';
  document.getElementById('memoInput').value = '';
  document.getElementById('newTagInput').value = '';
  renderTagPool();
}

function openAddForm(){
  resetForm();
  showFormView();
}
function openEditForm(id){
  const e = entries[id];
  if (!e) return;
  editingId = id;
  currentPhotos = (e.photos || (e.photo ? [e.photo] : [])).slice();
  currentPhotoGPS = (e.lat && e.lng) ? {lat:e.lat, lng:e.lng} : null;
  photoChosen = currentPhotos.length > 0;
  selectedTags = (e.tags || []).slice();
  renderPhotoPreviewList();
  document.getElementById('locationPickerMapWrap').style.display = 'none';
  updateGpsInfo();
  const d = new Date(e.date);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  document.getElementById('dateInput').value = isNaN(d) ? nowLocalInputValue() : d.toISOString().slice(0,16);
  document.getElementById('targetInput').value = e.target || '';
  document.getElementById('memoInput').value = e.memo || '';
  renderTagPool();
  showFormView();
}
function showFormView(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('formView').classList.add('active');
  document.getElementById('fabAdd').style.display = 'none';
  document.getElementById('saveBar').style.display = 'flex';
}
function backToList(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('listView').classList.add('active');
  document.querySelector('.tab[data-view="listView"]').classList.add('active');
  document.getElementById('fabAdd').style.display = 'flex';
  document.getElementById('saveBar').style.display = 'none';
}

document.getElementById('fabAdd').addEventListener('click', openAddForm);
document.getElementById('cancelBtn').addEventListener('click', backToList);

/* ---------- 写真処理 & GPS抽出 ---------- */
function updateGpsInfo(){
  const gi = document.getElementById('gpsInfo');
  const btn = document.getElementById('useCurrentLocationBtn');
  if (currentPhotoGPS){
    gi.textContent = `📍 GPS取得済み (${currentPhotoGPS.lat.toFixed(5)}, ${currentPhotoGPS.lng.toFixed(5)})`;
    gi.className = 'gps-info ok';
    btn.style.display = 'none';
  } else if (photoChosen){
    gi.textContent = 'この写真にはGPS情報がありません（ブラウザのカメラ機能では位置情報が記録されないことがあります）';
    gi.className = 'gps-info ng';
    btn.style.display = 'inline-block';
  } else {
    gi.textContent = '';
    gi.className = 'gps-info';
    btn.style.display = 'none';
  }
  syncLocationPickerMarker();
}

document.getElementById('useCurrentLocationBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('useCurrentLocationBtn');
  if (!navigator.geolocation){
    alert('この端末・ブラウザでは現在地の取得に対応していません。');
    return;
  }
  btn.textContent = '取得中…';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      currentPhotoGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      btn.textContent = '📍 現在地を使う';
      updateGpsInfo();
    },
    err=>{
      btn.textContent = '📍 現在地を使う';
      alert('現在地の取得に失敗しました：' + err.message + '\n\n位置情報の利用が許可されているか確認してください。');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

/* ---------- 地図で位置を選択 ---------- */
let locationPickerMap = null;
let locationPickerMarker = null;

function syncLocationPickerMarker(){
  if (!locationPickerMap || !locationPickerMarker) return;
  if (currentPhotoGPS){
    const ll = [currentPhotoGPS.lat, currentPhotoGPS.lng];
    locationPickerMarker.setLatLng(ll);
    locationPickerMap.setView(ll, Math.max(locationPickerMap.getZoom(), 15));
  }
}

function ensureLocationPickerMap(){
  if (locationPickerMap) return;
  const center = currentPhotoGPS ? [currentPhotoGPS.lat, currentPhotoGPS.lng] : [35.5, 139.4];
  locationPickerMap = L.map('locationPickerMap').setView(center, currentPhotoGPS ? 16 : 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(locationPickerMap);
  locationPickerMarker = L.marker(center, { draggable: true }).addTo(locationPickerMap);
  locationPickerMarker.on('dragend', ()=>{
    const pos = locationPickerMarker.getLatLng();
    currentPhotoGPS = { lat: pos.lat, lng: pos.lng };
    updateGpsInfo();
  });
  locationPickerMap.on('click', (e)=>{
    locationPickerMarker.setLatLng(e.latlng);
    currentPhotoGPS = { lat: e.latlng.lat, lng: e.latlng.lng };
    updateGpsInfo();
  });
}

document.getElementById('toggleMapPickerBtn').addEventListener('click', ()=>{
  const wrap = document.getElementById('locationPickerMapWrap');
  const showing = wrap.style.display !== 'none';
  if (showing){
    wrap.style.display = 'none';
  } else {
    wrap.style.display = 'block';
    ensureLocationPickerMap();
    setTimeout(()=>{
      locationPickerMap.invalidateSize();
      syncLocationPickerMarker();
    }, 100);
  }
});

function pad2(n){ return String(Math.floor(n)).padStart(2,'0'); }

// datetime-local入力欄用のローカル日時文字列(YYYY-MM-DDTHH:MM)を作る
function toLocalInputValue(dateObj){
  const d = new Date(dateObj);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

// GPSタイムスタンプ(UTC)優先、なければ撮影日時(DateTimeOriginal/CreateDate)、それも無ければnull
function extractPhotoDateTime(tags){
  const gpsDate = tags.GPSDateStamp;
  const gpsTime = tags.GPSTimeStamp;
  if (gpsDate && gpsTime && gpsTime.length === 3){
    let y, mo, da;
    if (typeof gpsDate === 'string'){
      const parts = gpsDate.split(':').map(n=>parseInt(n,10));
      if (parts.length === 3){ y = parts[0]; mo = parts[1]-1; da = parts[2]; }
    } else if (gpsDate instanceof Date){
      y = gpsDate.getUTCFullYear(); mo = gpsDate.getUTCMonth(); da = gpsDate.getUTCDate();
    }
    if (y != null){
      const utcMs = Date.UTC(y, mo, da, Math.floor(gpsTime[0]), Math.floor(gpsTime[1]), Math.floor(gpsTime[2]));
      if (!isNaN(utcMs)) return new Date(utcMs);
    }
  }
  const original = tags.DateTimeOriginal || tags.CreateDate;
  if (original instanceof Date && !isNaN(original)) return original;
  if (typeof original === 'string'){
    const m = original.match(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
    if (m){
      const d = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]);
      if (!isNaN(d)) return d;
    }
  }
  return null;
}

// EXIF Orientationを考慮しつつ、長辺maxDimにリサイズ・JPEG圧縮してcanvasを返す
function drawOrientedImage(img, orientation, maxDim){
  let w = img.naturalWidth, h = img.naturalHeight;
  if (w > maxDim || h > maxDim){
    if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
    else { w = Math.round(w * maxDim / h); h = maxDim; }
  }
  const canvas = document.createElement('canvas');
  const swap = orientation >= 5 && orientation <= 8;
  canvas.width = swap ? h : w;
  canvas.height = swap ? w : h;
  const ctx = canvas.getContext('2d');
  switch(orientation){
    case 2: ctx.transform(-1,0,0,1,canvas.width,0); break;
    case 3: ctx.transform(-1,0,0,-1,canvas.width,canvas.height); break;
    case 4: ctx.transform(1,0,0,-1,0,canvas.height); break;
    case 5: ctx.transform(0,1,1,0,0,0); break;
    case 6: ctx.transform(0,1,-1,0,canvas.height,0); break;
    case 7: ctx.transform(0,-1,-1,0,canvas.height,canvas.width); break;
    case 8: ctx.transform(0,-1,1,0,0,canvas.width); break;
    default: break;
  }
  ctx.drawImage(img, 0, 0, w, h);
  return canvas;
}

function renderPhotoPreviewList(){
  const wrap = document.getElementById('photoPreviewList');
  wrap.innerHTML = '';
  currentPhotos.forEach((dataUrl, idx)=>{
    const item = document.createElement('div');
    item.className = 'photo-preview-item';
    const img = document.createElement('img');
    img.src = dataUrl;
    img.addEventListener('click', ()=> openPhotoViewer(currentPhotos, idx));
    const removeBtn = document.createElement('button');
    removeBtn.className = 'photo-item-remove';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      currentPhotos.splice(idx, 1);
      photoChosen = currentPhotos.length > 0;
      renderPhotoPreviewList();
      updateGpsInfo();
    });
    item.appendChild(img);
    item.appendChild(removeBtn);
    wrap.appendChild(item);
  });
}

async function addSinglePhoto(file, allowAutoFill){
  // GPS座標抽出 (exifr.gpsは内部でDMS→10進変換まで行ってくれるため安定)
  if (!currentPhotoGPS){
    try {
      const gps = await exifr.gps(file);
      if (gps && isFinite(gps.latitude) && isFinite(gps.longitude)){
        currentPhotoGPS = { lat: gps.latitude, lng: gps.longitude };
        updateGpsInfo();
      }
    } catch(e){
      console.warn('GPS抽出失敗', e);
    }
  }

  // 日時・向きの抽出
  let orientation = 1;
  try {
    const tags = await exifr.parse(file, {
      pick: ['DateTimeOriginal','CreateDate','GPSDateStamp','GPSTimeStamp','Orientation']
    });
    if (tags){
      if (tags.Orientation) orientation = tags.Orientation;
      if (allowAutoFill){
        const photoDate = extractPhotoDateTime(tags);
        if (photoDate){
          document.getElementById('dateInput').value = toLocalInputValue(photoDate);
        }
      }
    }
  } catch(e){
    console.warn('EXIF日時抽出失敗', e);
  }

  // 画像の圧縮・向き補正
  const dataUrl = await new Promise((resolve)=>{
    const imgReader = new FileReader();
    imgReader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        try{
          const canvas = drawOrientedImage(img, orientation, 1600);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        } catch(e){
          console.error('画像の圧縮に失敗、元画像を使用します', e);
          resolve(ev.target.result);
        }
      };
      img.src = ev.target.result;
    };
    imgReader.readAsDataURL(file);
  });

  currentPhotos.push(dataUrl);
  renderPhotoPreviewList();
}

async function addPhotoFiles(fileList){
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const allowAutoFill = currentPhotos.length === 0; // 最初の写真のときだけ日時を自動セット
  photoChosen = true;
  updateGpsInfo();
  for (const file of files){
    await addSinglePhoto(file, allowAutoFill);
  }
  updateGpsInfo();
}

document.getElementById('cameraInput').addEventListener('change', e=>{

document.getElementById('galleryInput').addEventListener('change', e=>{

});

function submitNewTag(){
  const input = document.getElementById('newTagInput');
  const val = input.value.trim();
  if (!val) return;
  addTagToPool(val);
  if (!selectedTags.includes(val)) selectedTags.push(val);
  input.value = '';
  renderTagPool();
}
document.getElementById('addTagBtn').addEventListener('click', submitNewTag);
document.getElementById('newTagInput').addEventListener('keydown', e=>{
  if (e.key === 'Enter'){ e.preventDefault(); submitNewTag(); }
});

  const entry = {

    photos: currentPhotos.slice(),
    lat: currentPhotoGPS ? currentPhotoGPS.lat : null,
    lng: currentPhotoGPS ? currentPhotoGPS.lng : null,
    tags: selectedTags.slice(),

    memo: document.getElementById('memoInput').value.trim(),
    createdAt: editingId && entries[editingId] ? entries[editingId].createdAt : new Date().toISOString()
  };
  persistEntry(entry);
  backToList();
});

/* ---------- 写真フルスクリーンビューア ---------- */
(function(){
  const viewer = document.getElementById('photoViewer');
  const stage = document.getElementById('photoViewerStage');
  const img = document.getElementById('photoViewerImg');
  const closeBtn = document.getElementById('photoViewerClose');
  const prevBtn = document.getElementById('photoViewerPrev');
  const nextBtn = document.getElementById('photoViewerNext');
  const counterEl = document.getElementById('photoViewerCounter');

  let photoList = [];
  let currentIndex = 0;
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, startTx = 0, startTy = 0;
  let pinchStartDist = 0, pinchStartScale = 1;
  let lastTapTime = 0;
  let swipeStartX = null, swipeStartY = null;
  const pointers = {};

  function applyTransform(){
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
  function resetTransform(){
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  }
  function updateNav(){
    const multi = photoList.length > 1;
    prevBtn.style.display = multi ? 'flex' : 'none';
    nextBtn.style.display = multi ? 'flex' : 'none';
    counterEl.textContent = multi ? `${currentIndex + 1} / ${photoList.length}` : '';
  }
  function showIndex(idx){
    if (!photoList.length) return;
    currentIndex = (idx + photoList.length) % photoList.length;
    img.src = photoList[currentIndex];
    resetTransform();
    updateNav();
  }
  window.openPhotoViewer = function(src, startIndex){
    if (Array.isArray(src)){
      photoList = src;
      showIndex(startIndex || 0);
    } else {
      photoList = [src];
      showIndex(0);
    }
    viewer.classList.add('active');
  };
  function closeViewer(){
    viewer.classList.remove('active');
    img.src = '';
    photoList = [];
  }
  closeBtn.addEventListener('click', closeViewer);
  prevBtn.addEventListener('click', ()=> showIndex(currentIndex - 1));
  nextBtn.addEventListener('click', ()=> showIndex(currentIndex + 1));

  stage.addEventListener('pointerdown', e=>{
    stage.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(pointers);
    if (ids.length === 1){
      const now = Date.now();
      if (now - lastTapTime < 300){
        // ダブルタップでズームのトグル
        if (scale > 1){ resetTransform(); }
        else { scale = 2.5; applyTransform(); }
        lastTapTime = 0;
        dragging = false;
        swipeStartX = null;
      } else {
        lastTapTime = now;
        dragging = true;
        dragStartX = e.clientX; dragStartY = e.clientY;
        startTx = tx; startTy = ty;
        if (scale === 1){ swipeStartX = e.clientX; swipeStartY = e.clientY; }
      }
    } else if (ids.length === 2){
      dragging = false;
      swipeStartX = null;
      const [p1, p2] = ids.map(id=>pointers[id]);
      pinchStartDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      pinchStartScale = scale;
    }
  });

  stage.addEventListener('pointermove', e=>{
    if (!(e.pointerId in pointers)) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(pointers);
    if (ids.length === 2){
      const [p1, p2] = ids.map(id=>pointers[id]);
      const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (pinchStartDist > 0){
        scale = Math.min(5, Math.max(1, pinchStartScale * (dist / pinchStartDist)));
        if (scale === 1){ tx = 0; ty = 0; }
        applyTransform();
      }
    } else if (ids.length === 1 && dragging && scale > 1){
      tx = startTx + (e.clientX - dragStartX);
      ty = startTy + (e.clientY - dragStartY);
      applyTransform();
    }
  });

  function endPointer(e){
    // 等倍表示中に横スワイプしていたら前後の写真に切り替え
    if (scale === 1 && swipeStartX !== null && e.clientX !== undefined){
      const dx = e.clientX - swipeStartX;
      const dy = e.clientY - swipeStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && photoList.length > 1){
        showIndex(currentIndex + (dx < 0 ? 1 : -1));
      }
    }
    swipeStartX = null;
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinchStartDist = 0;
    if (Object.keys(pointers).length === 0) dragging = false;
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', endPointer);

  // マウスホイール／トラックパッドでのズーム(デスクトップ用)
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    scale = Math.min(5, Math.max(1, scale - e.deltaY * 0.002));
    if (scale === 1){ tx = 0; ty = 0; }
    applyTransform();
  }, { passive: false });
})();
